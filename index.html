<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procrastination.math Arcade</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f0f12; color: #fff; text-align: center; padding: 20px; margin: 0; }
        header { padding: 40px 20px; background: linear-gradient(135deg, #1e1e2f, #111119); border-bottom: 2px solid #33334d; }
        h1 { margin: 0 0 10px 0; color: #00ffcc; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #8a8a9e; margin: 0; font-size: 1.1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .game-card { background: #1e1e24; padding: 20px; border-radius: 12px; text-decoration: none; color: #fff; font-weight: bold; border: 2px solid #2d2d38; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .game-card:hover { background: #00ffcc; color: #000; border-color: #00ffcc; transform: translateY(-4px); box-shadow: 0 8px 15px rgba(0, 255, 204, 0.3); }
        .game-icon { font-size: 2rem; margin-bottom: 8px; }
    </style>
</head>
<body>

    <header>
        <h1>Procrastination.math</h1>
        <p>i got tired of google sites and moved to github</p>
    </header>

    <div class="grid" id="game-list">Loading game assets...</div>

    <script>
        async function loadGames() {
            try {
                // Fetches via a proxy-free public folder layout feed endpoint
                const response = await fetch('https://github.com');
                
                // If GitHub throttles the main connection, use the backup tree architecture seamlessly
                if (!response.ok) {
                    throw new Error('API restriction hit, switching to backup router');
                }
                
                const files = await response.json();
                const listDiv = document.getElementById('game-list');
                listDiv.innerHTML = '';
                let count = 0;

                files.forEach(file => {
                    // Pull any standalone HTML files, ignore the index loader page
                    if(file.name.endsWith('.html') && file.name.toLowerCase() !== 'index.html') {
                        count++;
                        const gameName = file.name.replace('.html', '').replace(/[-_]/g, ' ').toUpperCase();
                        
                        const card = document.createElement('a');
                        card.className = 'game-card';
                        card.href = file.path;
                        card.innerHTML = `
                            <div class="game-icon">🕹️</div>
                            <div>${gameName}</div>
                        `;
                        listDiv.appendChild(card);
                    }
                });

                if(count === 0) {
                    listDiv.innerText = "No separate game files discovered in your main branch.";
                }
            } catch (error) {
                // FALLBACK: If GitHub totally blocks the API, it reads your raw layout directly
                try {
                    const backupResponse = await fetch('https://github.com');
                    const backupData = await backupResponse.json();
                    const listDiv = document.getElementById('game-list');
                    listDiv.innerHTML = '';
                    let count = 0;

                    backupData.tree.forEach(file => {
                        if (file.path.endsWith('.html') && file.path.toLowerCase() !== 'index.html') {
                            count++;
                            const gameName = file.path.replace('.html', '').replace(/[-_]/g, ' ').toUpperCase();
                            const card = document.createElement('a');
                            card.className = 'game-card';
                            card.href = file.path;
                            card.innerHTML = `<div class="game-icon">🕹️</div><div>${gameName}</div>`;
                            listDiv.appendChild(card);
                        }
                    });
                } catch(e) {
                    document.getElementById('game-list').innerText = "GitHub servers are busy. Please refresh the page in a few seconds.";
                }
            }
        }
        loadGames();
    </script>
</body>
</html>
