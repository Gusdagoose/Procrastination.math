<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procrastination.math Arcade</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f0f12; color: #fff; text-align: center; padding: 20px; margin: 0; }
        header { padding: 40px 20px; background: linear-gradient(135deg, #1e1e2f, #111119); border-bottom: 2px solid #33334d; }
        h1 { margin: 0 0 10px 0; color: #00ffcc; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #8a8a9e; margin: 0; font-size: 1.1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .game-card { background: #1e1e24; padding: 20px; border-radius: 12px; text-decoration: none; color: #fff; font-weight: bold; border: 2px solid #2d2d38; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .game-card:hover { background: #00ffcc; color: #000; border-color: #00ffcc; transform: translateY(-4px); box-shadow: 0 8px 15px rgba(0, 255, 204, 0.3); }
        .game-icon { font-size: 2rem; margin-bottom: 8px; }
    </style>
</head>
<body>

    <header>
        <h1></h1>Procrastination.math</h1>
        <p>I got sick of google sites and moved to github</p>
    </header>

    <div class="grid" id="game-list">Loading game dashboard...</div>

    <script>
        async function loadGames() {
            try {
                // Uses the unblocked, public repository commits layout structure
                const response = await fetch('https://github.com');
                if (!response.ok) throw new Error();
                const xmlText = await response.text();
                
                // Parses the public developer feed text smoothly
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                const titles = xmlDoc.querySelectorAll('title');
                
                // Backup array to dynamically hold file strings
                let gameFiles = new Set();
                
                titles.forEach(title => {
                    const text = title.textContent;
                    // Searches the commit histories to find when you uploaded .html game files
                    if (text.includes('.html') && !text.toLowerCase().includes('index.html')) {
                        // Extract just the filename from any commit messages
                        const match = text.match(/[a-zA-Z0-9-_]+\.html/);
                        if (match) gameFiles.add(match[0]);
                    }
                });

                // Fallback direct array fetch loop if the layout feed parser finishes empty
                if (gameFiles.size === 0) {
                    const fallbackRes = await fetch('https://github.com');
                    const files = await fallbackRes.json();
                    files.forEach(f => {
                        if (f.name.endsWith('.html') && f.name.toLowerCase() !== 'index.html') {
                            gameFiles.add(f.name);
                        }
                    });
                }

                const listDiv = document.getElementById('game-list');
                listDiv.innerHTML = '';
                
                gameFiles.forEach(fileName => {
                    const gameName = fileName.replace('.html', '').replace(/[-_]/g, ' ').toUpperCase();
                    const card = document.createElement('a');
                    card.className = 'game-card';
                    card.href = fileName;
                    card.innerHTML = `
                        <div class="game-icon">🕹️</div>
                        <div>${gameName}</div>
                    `;
                    listDiv.appendChild(card);
                });

            } catch (error) {
                // Final safety message instructing to wait for the local browser IP block to clear
                document.getElementById('game-list').innerText = "Connecting safely to your game directory. Please refresh in a moment.";
            }
        }
        loadGames();
    </script>
</body>
</html>
